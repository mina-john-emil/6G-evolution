
{{- range .Values.nfs }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-{{ .name }}
  namespace: open5gs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open5gs-{{ .name }}
  template:
    metadata:
      labels:
        app: open5gs-{{ .name }}
    spec:
      {{ if .privileged }}
      initContainers:
        - name: net-setup
          image: alpine:3.20
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache iptables
              sysctl -w net.ipv4.ip_forward=1
              iptables -t nat -A POSTROUTING -s 10.45.0.0/16 ! -o ogstun -j MASQUERADE
              iptables -t nat -A POSTROUTING -s 10.46.0.0/24 ! -o ogstun2 -j MASQUERADE
              iptables -t nat -A POSTROUTING -s 10.47.0.0/24 ! -o ogstun3 -j MASQUERADE
              for a in ogstun ogstun2 ogstun3; do for b in ogstun ogstun2 ogstun3; do
                if [ "$a" != "$b" ]; then iptables -A FORWARD -i $a -o $b -j DROP; fi
              done; done
      {{ end }}
      containers:
        - name: {{ .name }}
          image: {{ $.Values.image }}
          imagePullPolicy: Always
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command: ["/bin/sh", "-c"]
          args:
            - |
              sed "s/__POD_IP__/${POD_IP}/g" /etc/open5gs/{{ .name }}.yaml > /tmp/{{ .name }}.yaml
              {{ if eq .name "upf" }}
              open5gs-upfd -c /tmp/upf.yaml &
              UPF_PID=$!

              trap 'kill -TERM "$UPF_PID" 2>/dev/null; wait "$UPF_PID"' TERM INT

              i=0
              while [ "$i" -lt 30 ]; do
                if ip link show ogstun >/dev/null 2>&1; then
                  ip addr replace 10.45.0.1/16 dev ogstun
                  ip link set dev ogstun up
                  sleep 2
                  for pair in ogstun2:10.46.0.1/24 ogstun3:10.47.0.1/24; do
                    ip addr replace "${pair#*:}" dev "${pair%%:*}"
                    ip link set dev "${pair%%:*}" up
                  done
                  break
                fi
                i=$((i+1))
                sleep 1
              done

              apply_tc() {
                dev=$1; down=$2; dburst=$3; dlat=$4; up=$5; uburst=$6
                tc qdisc replace dev $dev root tbf rate $down burst $dburst latency $dlat
                tc qdisc replace dev $dev handle ffff: ingress
                tc filter replace dev $dev parent ffff: protocol all prio 1 u32 match u32 0 0 police rate $up burst $uburst mtu 2kb drop flowid :1
              }
              apply_tc ogstun  100mbit 64kb 50ms  50mbit 256k
              apply_tc ogstun2 20mbit  32kb 20ms  20mbit 256k
              apply_tc ogstun3 1mbit   8kb  100ms 1mbit   32k
              echo "tc rules applied:"
              tc qdisc show dev ogstun; tc qdisc show dev ogstun2; tc qdisc show dev ogstun3

              if ! ip -4 addr show dev ogstun | grep -q '10.45.0.1/16'; then
                echo "ERROR: ogstun was not configured successfully"
                kill -TERM "$UPF_PID" 2>/dev/null
                wait "$UPF_PID"
                exit 1
              fi

              echo "ogstun configured successfully:"
              ip -br addr show ogstun

              wait "$UPF_PID"
              {{ else }}
              exec {{ .daemon }} -c /tmp/{{ .name }}.yaml
              {{ end }}
          {{ if .privileged }}
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          {{ end }}
          volumeMounts:
            - name: config
              mountPath: /etc/open5gs
            {{ if eq .name "udm" }}
            - name: hnet
              mountPath: /etc/open5gs/hnet
            {{ end }}
            {{ if .privileged }}
            - name: dev-net-tun
              mountPath: /dev/net/tun
            {{ end }}
      volumes:
        - name: config
          configMap:
            name: open5gs-{{ .name }}-config
        {{ if eq .name "udm" }}
        - name: hnet
          secret:
            secretName: open5gs-udm-hnet
        {{ end }}
        {{ if .privileged }}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        {{ end }}
---
{{- end }}
