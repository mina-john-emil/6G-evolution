
{{- range .Values.nfs }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-{{ .name }}
  namespace: open5gs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open5gs-{{ .name }}
  template:
    metadata:
      labels:
        app: open5gs-{{ .name }}
    spec:
      {{ if .privileged }}
      initContainers:
        - name: net-setup
          image: alpine:3.20
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache iptables
              sysctl -w net.ipv4.ip_forward=1
              iptables -t nat -A POSTROUTING -s 10.45.0.0/16 ! -o ogstun -j MASQUERADE
      {{ end }}
      containers:
        - name: {{ .name }}
          image: {{ $.Values.image }}
          imagePullPolicy: Always
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command: ["/bin/sh", "-c"]
          args:
            - |
              sed "s/__POD_IP__/${POD_IP}/g" /etc/open5gs/{{ .name }}.yaml > /tmp/{{ .name }}.yaml
              {{ if eq .name "upf" }}
              open5gs-upfd -c /tmp/upf.yaml &
              UPF_PID=$!

              trap 'kill -TERM "$UPF_PID" 2>/dev/null; wait "$UPF_PID"' TERM INT

              i=0
              while [ "$i" -lt 30 ]; do
                if ip link show ogstun >/dev/null 2>&1; then
                  ip addr replace 10.45.0.1/16 dev ogstun
                  ip link set dev ogstun up
                  break
                fi
                i=$((i+1))
                sleep 1
              done

              if ! ip -4 addr show dev ogstun | grep -q '10.45.0.1/16'; then
                echo "ERROR: ogstun was not configured successfully"
                kill -TERM "$UPF_PID" 2>/dev/null
                wait "$UPF_PID"
                exit 1
              fi

              echo "ogstun configured successfully:"
              ip -br addr show ogstun

              wait "$UPF_PID"
              {{ else }}
              exec {{ .daemon }} -c /tmp/{{ .name }}.yaml
              {{ end }}
          {{ if .privileged }}
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          {{ end }}
          volumeMounts:
            - name: config
              mountPath: /etc/open5gs
            {{ if eq .name "udm" }}
            - name: hnet
              mountPath: /etc/open5gs/hnet
            {{ end }}
            {{ if .privileged }}
            - name: dev-net-tun
              mountPath: /dev/net/tun
            {{ end }}
      volumes:
        - name: config
          configMap:
            name: open5gs-{{ .name }}-config
        {{ if eq .name "udm" }}
        - name: hnet
          secret:
            secretName: open5gs-udm-hnet
        {{ end }}
        {{ if .privileged }}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        {{ end }}
---
{{- end }}
