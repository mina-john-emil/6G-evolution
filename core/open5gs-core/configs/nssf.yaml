logger:
  file:
    path: /var/log/open5gs/nssf.log

global:
  max:
    ue: 1024

nssf:
  sbi:
    server:
      - address: 0.0.0.0
        port: 7777
        advertise: open5gs-nssf.open5gs.svc.cluster.local
    client:
      nrf:
        - uri: http://open5gs-nrf.open5gs.svc.cluster.local:7777
      nsi:
        - uri: http://open5gs-nrf.open5gs.svc.cluster.local:7777
          s_nssai:
            sst: 1
