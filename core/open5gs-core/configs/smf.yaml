logger:
  file:
    path: /var/log/open5gs/smf.log

global:
  max:
    ue: 1024

smf:
  sbi:
    server:
      - address: 0.0.0.0
        port: 7777
        advertise: open5gs-smf.open5gs.svc.cluster.local
    client:
      nrf:
        - uri: http://open5gs-nrf.open5gs.svc.cluster.local:7777
  pfcp:
    server:
      - address: __POD_IP__
    client:
      upf:
        - address: open5gs-upf.open5gs.svc.cluster.local
  gtpc:
    server:
      - address: __POD_IP__
  gtpu:
    server:
      - address: __POD_IP__
  metrics:
    server:
      - address: 0.0.0.0
        port: 9090
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
      dnn: internet
    - subnet: 2001:db8:cafe::/48
      gateway: 2001:db8:cafe::1
      dnn: internet
    - subnet: 10.46.0.0/24
      gateway: 10.46.0.1
      dnn: urllc
    - subnet: 10.47.0.0/24
      gateway: 10.47.0.1
      dnn: mmtc
  dns:
    - 8.8.8.8
    - 8.8.4.4
    - 2001:4860:4860::8888
    - 2001:4860:4860::8844
  mtu: 1400
