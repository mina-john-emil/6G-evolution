apiVersion: v1
kind: ConfigMap
metadata:
  name: ueransim-config
  namespace: open5gs
data:
  gnb.yaml: |
    mcc: '999'
    mnc: '70'
    nci: '0x000000010'
    idLength: 32
    tac: 1
    linkIp: 127.0.0.1
    ngapIp: __POD_IP__
    gtpIp: __POD_IP__
    amfConfigs:
      - address: __AMF_IP__
        port: 38412
    slices:
      - sst: 1
      - sst: 2
      - sst: 3
    ignoreStreamIds: true
  ue-base.yaml: |
    supi: 'imsi-__IMSI__'
    mcc: '999'
    mnc: '70'
    protectionScheme: 0
    homeNetworkPublicKey: '5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650'
    homeNetworkPublicKeyId: 1
    routingIndicator: '0000'
    key: '__UE_K__'
    op: '__UE_OPC__'
    opType: 'OPC'
    amf: '8000'
    imei: '356938035643803'
    imeiSv: '4370816125816151'
    tunNetmask: '255.255.255.0'
    gnbSearchList:
      - 127.0.0.1
    uacAic: { mps: false, mcs: false }
    uacAcc: { normalClass: 0, class11: false, class12: false, class13: false, class14: false, class15: false }
    integrity: { IA1: true, IA2: true, IA3: true }
    ciphering: { EA1: true, EA2: true, EA3: true }
    integrityMaxRate: { uplink: 'full', downlink: 'full' }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ueransim
  namespace: open5gs
spec:
  replicas: 1
  selector:
    matchLabels: { app: ueransim }
  template:
    metadata:
      labels: { app: ueransim }
    spec:
      containers:
        - name: gnb
          image: 021686096644.dkr.ecr.us-east-1.amazonaws.com/ueransim:v1
          env:
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          command: ["/bin/sh", "-c"]
          args:
            - |
              AMF_IP=$(getent hosts open5gs-amf.open5gs.svc.cluster.local | awk '{print $1}')
              sed -e "s/__POD_IP__/${POD_IP}/g" -e "s/__AMF_IP__/${AMF_IP}/g" /config/gnb.yaml > /tmp/gnb.yaml
              exec /ueransim/build/nr-gnb -c /tmp/gnb.yaml
          volumeMounts:
            - { name: config, mountPath: /config }
        - name: ue
          image: 021686096644.dkr.ecr.us-east-1.amazonaws.com/ueransim:v1
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              K="$(cat /run/ue-auth/k)"
              OPC="$(cat /run/ue-auth/opc)"
              # mk <name> <imsi> "<dnn>:<sst> ..."  -> /tmp/ue-<name>.yaml
              mk() {
                sed -e "s/__UE_K__/${K}/" -e "s/__UE_OPC__/${OPC}/" -e "s/__IMSI__/$2/" /config/ue-base.yaml > /tmp/ue-$1.yaml
                { echo "sessions:"
                  for x in $3; do echo "  - { type: 'IPv4', apn: '${x%%:*}', slice: { sst: ${x#*:} } }"; done
                  echo "configured-nssai:"
                  for x in $3; do echo "  - { sst: ${x#*:} }"; done; } >> /tmp/ue-$1.yaml
              }
              mk embb  999700000000002 "internet:1"
              mk urllc 999700000000003 "urllc:2"
              mk mmtc  999700000000004 "mmtc:3"
              mk multi 999700000000005 "internet:1 urllc:2 mmtc:3"
              mk neg   999700000000006 "urllc:2"
              sleep 15   # let the gNB come up
              run_ue() {
                while true; do
                  /ueransim/build/nr-ue -c /tmp/ue-$1.yaml >> /tmp/ue-$1.log 2>&1
                  sleep 5
                done
              }
              run_ue embb  &
              sleep 8
              run_ue urllc &
              sleep 8
              run_ue mmtc  &
              exec sleep infinity
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: dev-net-tun, mountPath: /dev/net/tun }
            - { name: ue-auth, mountPath: /run/ue-auth, readOnly: true }
      volumes:
        - name: config
          configMap: { name: ueransim-config }
        - name: dev-net-tun
          hostPath: { path: /dev/net/tun, type: CharDevice }
        - name: ue-auth
          secret:
            secretName: ue-auth
